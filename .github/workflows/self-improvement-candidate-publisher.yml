name: Self-Improvement Candidate Publisher

on:
  workflow_run:
    workflows:
      - Self-Improvement Review
    types:
      - completed

# Deliberately separate from the read-only reviewer. This workflow can only
# read its trusted artifact and maintain candidate Issues.
permissions:
  actions: read
  issues: write

jobs:
  publish:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Verify trusted review run and artifact
        id: source
        uses: actions/github-script@v7
        with:
          script: |
            const expected = context.payload.workflow_run;
            if (!Number.isSafeInteger(expected.id) || expected.id <= 0) throw new Error('Invalid source run ID');
            const { data: run } = await github.rest.actions.getWorkflowRun({
              ...context.repo,
              run_id: expected.id,
            });
            if (run.id !== expected.id || run.name !== 'Self-Improvement Review') {
              throw new Error('Unexpected source workflow identity');
            }
            if (run.path !== '.github/workflows/self-improvement-review.yml') {
              throw new Error('Unexpected source workflow path');
            }
            if (run.event !== 'workflow_run' || run.conclusion !== 'success' || run.head_branch !== 'main') {
              throw new Error('Source was not a successful trusted main-branch review');
            }
            if (!/^[0-9a-f]{40}$/i.test(run.head_sha) || run.head_sha !== expected.head_sha) {
              throw new Error('Invalid or inconsistent source head SHA');
            }
            const { data: artifacts } = await github.rest.actions.listWorkflowRunArtifacts({
              ...context.repo,
              run_id: run.id,
              name: 'self-improvement-review',
              per_page: 100,
            });
            const exact = artifacts.artifacts.filter((artifact) =>
              artifact.name === 'self-improvement-review' && !artifact.expired
            );
            if (exact.length !== 1) throw new Error(`Expected one validated artifact, found ${exact.length}`);
            core.setOutput('run-id', String(run.id));
            core.setOutput('head-sha', run.head_sha);

      - name: Download exact validated review artifact
        uses: actions/download-artifact@v4
        with:
          name: self-improvement-review
          path: candidate-artifact
          run-id: ${{ steps.source.outputs.run-id }}
          github-token: ${{ github.token }}

      - name: Publish candidate record
        uses: actions/github-script@v7
        env:
          SOURCE_RUN_ID: ${{ steps.source.outputs.run-id }}
          SOURCE_HEAD_SHA: ${{ steps.source.outputs.head-sha }}
        with:
          script: |
            const fs = require('node:fs');
            const crypto = require('node:crypto');
            const resultPath = 'candidate-artifact/self-improvement-result.md';
            if (!fs.existsSync(resultPath)) throw new Error('Validated result is missing');
            const markdown = fs.readFileSync(resultPath, 'utf8').trim();
            const verificationSectionNames = ['Verification Target', 'Verification Evidence', 'Residual Risk'];
            const candidateSectionNames = ['Title', 'Observation', 'Evidence', 'Impact', 'Scores', 'Suggested Scope', 'Non-Goals'];
            // Locate headings once, ignoring example headings inside Markdown
            // fences. A section ends at the next real heading or document end.
            const headings = [];
            let fence = null;
            for (const line of markdown.matchAll(/^(.*)(?:\r?\n|$)/gmu)) {
              const fenceMatch = line[1].match(/^ {0,3}(`{3,}|~{3,})(.*)$/u);
              if (fenceMatch) {
                const marker = fenceMatch[1][0];
                const length = fenceMatch[1].length;
                if (!fence) fence = { marker, length };
                else if (fence.marker === marker && length >= fence.length && /^\s*$/u.test(fenceMatch[2])) fence = null;
                continue;
              }
              if (fence) continue;
              const headingMatch = line[1].match(/^(#{1,2})[ \t]+([^\r\n]+?)[ \t]*$/u);
              if (headingMatch) headings.push({
                name: headingMatch[2].trim(),
                level: headingMatch[1].length,
                start: line.index,
                contentStart: line.index + line[1].length,
              });
            }
            const resultHeading = headings.find(({ level, name }) => level === 1 && name === 'Result');
            if (!resultHeading) throw new Error('Validated result has no recognized result');
            const nextTopHeading = headings.find(({ level, start }) => level === 1 && start > resultHeading.start);
            const result = markdown.slice(resultHeading.contentStart, nextTopHeading?.start ?? markdown.length)
              .trim().match(/^(NO_CANDIDATE|CANDIDATE)(?:\s|$)/u)?.[1];
            if (!result) throw new Error('Validated result has no recognized result');
            if (result === 'NO_CANDIDATE') {
              core.info('NO_CANDIDATE: no Issue will be created');
              return;
            }
            const resultHeadingIndex = headings.indexOf(resultHeading);
            const verificationHeadings = headings.slice(0, resultHeadingIndex);
            const candidateHeadings = headings.slice(resultHeadingIndex + 1)
              .filter(({ start }) => !nextTopHeading || start < nextTopHeading.start);
            const extractSections = (names, regionHeadings, regionEnd) => {
              const extracted = {};
              for (const name of names) {
                const headingIndex = regionHeadings.findIndex((heading) => heading.level === 2 && heading.name === name);
                if (headingIndex === -1) {
                  extracted[name] = '';
                  continue;
                }
                const heading = regionHeadings[headingIndex];
                const nextHeading = regionHeadings.slice(headingIndex + 1).find(({ level }) => level <= 2);
                extracted[name] = markdown.slice(heading.contentStart, nextHeading?.start ?? regionEnd).trim();
              }
              return extracted;
            };
            const sections = {
              ...extractSections(verificationSectionNames, verificationHeadings, resultHeading.start),
              ...extractSections(candidateSectionNames, candidateHeadings, nextTopHeading?.start ?? markdown.length),
            };
            for (const name of candidateSectionNames) {
              if (!sections[name]) throw new Error(`Candidate is missing ${name}`);
            }
            const normalizedTitle = sections.Title.normalize('NFKC').trim().toLowerCase().replace(/\s+/gu, ' ');
            const key = `sha256:${crypto.createHash('sha256').update(normalizedTitle).digest('hex')}`;
            const keyMarker = `<!-- self-improvement-candidate-key: ${key} -->`;
            const runMarker = `<!-- self-improvement-review-run: ${process.env.SOURCE_RUN_ID} -->`;

            const labels = [
              ['SI-후보', '5319e7', 'Self-improvement candidate registry record'],
              ['SI-승인대기', 'd4c5f9', 'Awaiting a human decision'],
              ['SI-승인', '0e8a16', 'Approved by a human; does not trigger implementation'],
              ['SI-보류', 'fbca04', 'Deferred by a human'],
              ['SI-거절', 'b60205', 'Rejected by a human'],
            ];
            for (const [name, color, description] of labels) {
              try {
                await github.rest.issues.getLabel({ ...context.repo, name });
              } catch (error) {
                if (error.status !== 404) throw error;
                await github.rest.issues.createLabel({ ...context.repo, name, color, description });
              }
            }

            const body = `${keyMarker}\n${runMarker}\n# Candidate Registry Record\n\n## Candidate Title\n${sections.Title}\n\n## Observation\n${sections.Observation}\n\n## Evidence\n${sections.Evidence}\n\n## Impact\n${sections.Impact}\n\n## Scores\n${sections.Scores}\n\n## Suggested Scope\n${sections['Suggested Scope']}\n\n## Non-Goals\n${sections['Non-Goals']}\n\n## Verification Status\n${markdown.match(/^# Verification\s+(PASS|CONCERN|NOT_APPLICABLE)/mu)?.[1] || 'UNKNOWN'}\n\n## Verification Target\n${sections['Verification Target'] || 'Not applicable'}\n\n## Verification Evidence\n${sections['Verification Evidence']}\n\n## Residual Risk\n${sections['Residual Risk']}\n\n## Source\n- Self-Improvement Review run ID: ${process.env.SOURCE_RUN_ID}\n- Source merge SHA: \`${process.env.SOURCE_HEAD_SHA}\`\n- Candidate Key: \`${key}\`\n\nChanging the human-decision label records a decision only. Approval does not start implementation, create a branch or pull request, or merge code.`;
            const findMatchingRecords = async () => (await github.paginate(github.rest.issues.listForRepo, {
              ...context.repo, labels: 'SI-후보', state: 'all', per_page: 100,
            })).filter((issue) => !issue.pull_request && String(issue.body || '').includes(keyMarker));

            // Recheck immediately before creation, then reconcile afterward.
            // Concurrent creators may both win the create race, but every run
            // deterministically converges the registry on the lowest Issue number.
            let matching = await findMatchingRecords();
            if (matching.length === 0) {
              await github.rest.issues.create({
                ...context.repo,
                title: `[Self-Improvement Candidate] ${sections.Title}`,
                body,
                labels: ['SI-후보', 'SI-승인대기'],
              });
            }
            matching = await findMatchingRecords();
            if (matching.length === 0) throw new Error('Candidate record was not visible after publication');
            matching.sort((left, right) => left.number - right.number);
            const [canonical, ...duplicates] = matching;
            const allRecords = [canonical, ...duplicates];
            const observations = [];
            for (const record of allRecords) {
              const comments = await github.paginate(github.rest.issues.listComments, {
                ...context.repo, issue_number: record.number, per_page: 100,
              });
              observations.push(String(record.body || ''), ...comments.map(({ body }) => String(body || '')));
            }
            if (!observations.some((text) => text.includes(runMarker))) {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: canonical.number,
                body: `${runMarker}\nReobserved by Self-Improvement Review run ${process.env.SOURCE_RUN_ID}.\n\nSource merge SHA: \`${process.env.SOURCE_HEAD_SHA}\``,
              });
            }
            const canonicalComments = await github.paginate(github.rest.issues.listComments, {
              ...context.repo, issue_number: canonical.number, per_page: 100,
            });
            let canonicalText = [canonical.body, ...canonicalComments.map(({ body }) => body)].join('\n');
            const runEntries = new Map();
            for (const text of observations) {
              for (const match of text.matchAll(/<!-- self-improvement-review-run: (\d+) -->/gu)) {
                if (!runEntries.has(match[1])) runEntries.set(match[1], match[0]);
              }
            }
            for (const [runId, marker] of runEntries) {
              if (canonicalText.includes(marker)) continue;
              const recurrence = `${marker}\nReconciled observation from duplicate Candidate Registry record (source run ${runId}).`;
              await github.rest.issues.createComment({ ...context.repo, issue_number: canonical.number, body: recurrence });
              canonicalText += `\n${recurrence}`;
            }
            for (const duplicate of duplicates) {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: duplicate.number,
                body: `Duplicate Candidate Registry record reconciled into canonical Issue #${canonical.number}.`,
              });
              await github.rest.issues.removeLabel({
                ...context.repo, issue_number: duplicate.number, name: 'SI-후보',
              }).catch((error) => {
                // Another concurrent reconciler may already have archived it.
                if (error.status !== 404) throw error;
              });
              await github.rest.issues.update({ ...context.repo, issue_number: duplicate.number, state: 'closed' });
            }
            core.info(`Candidate reconciled in canonical Issue #${canonical.number}`);
