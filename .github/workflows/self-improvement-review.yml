name: Self-Improvement Review

on:
  workflow_run:
    workflows:
      - Merged PR Review Gate
    types:
      - completed

# This workflow observes repository state only. It cannot create issues, update
# pull requests, push branches, or change labels.
permissions:
  actions: read
  contents: read
  issues: read
  pull-requests: read

jobs:
  review:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      # workflow_run has repository secrets even when the original PR was from
      # a fork. Use the untrusted workflow_run head SHA only as an API lookup
      # key; checkout and execution use the verified merge commit below.
      - name: Verify the human-merged pull request
        id: merged-pr
        uses: actions/github-script@v7
        with:
          script: |
            const run = context.payload.workflow_run;
            if (run.event !== 'pull_request') throw new Error('Gate was not triggered by a pull request');
            const { data: associated } = await github.request(
              'GET /repos/{owner}/{repo}/commits/{commit_sha}/pulls',
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                commit_sha: run.head_sha,
              },
            );
            const candidates = await Promise.all(associated.map(async ({ number }) => {
              const { data: pr } = await github.rest.pulls.get({
                ...context.repo,
                pull_number: number,
              });
              return pr;
            }));
            const matches = candidates.filter((pr) =>
              pr.head.sha === run.head_sha &&
              pr.base.ref === 'main' &&
              pr.merged === true &&
              Boolean(pr.merge_commit_sha) &&
              pr.merged_by?.type === 'User'
            );
            if (matches.length !== 1) {
              throw new Error(`Expected exactly one verified merged pull request, found ${matches.length}`);
            }
            const [pr] = matches;
            core.setOutput('number', pr.number);
            core.setOutput('title', pr.title);
            core.setOutput('base-sha', pr.base.sha);
            core.setOutput('merge-sha', pr.merge_commit_sha);
            const closingIssues = await github.graphql(`
              query($owner: String!, $repo: String!, $number: Int!) {
                repository(owner: $owner, name: $repo) {
                  pullRequest(number: $number) {
                    closingIssuesReferences(first: 10) {
                      pageInfo { hasNextPage }
                      nodes { number title body }
                    }
                  }
                }
              }
            `, { owner: context.repo.owner, repo: context.repo.repo, number: pr.number });
            const references = closingIssues.repository.pullRequest.closingIssuesReferences;
            if (references.pageInfo.hasNextPage) {
              throw new Error('More than 10 closing issues are not supported; refusing incomplete verification');
            }

            // Bound the data before it crosses the step boundary. In particular,
            // never place GitHub's potentially very large Issue bodies wholesale
            // in a single environment entry used by the Prepare step.
            const bodyBudget = 8_000;
            const bodyLimit = references.nodes.length
              ? Math.floor(bodyBudget / references.nodes.length)
              : 0;
            const boundedIssues = references.nodes.map(({ number, title, body }) => ({
              number,
              title,
              body: String(body || '').slice(0, bodyLimit),
            }));
            core.setOutput('closing-issues-json', JSON.stringify(boundedIssues));

      - name: Check out the merged repository
        uses: actions/checkout@v4
        with:
          # Rebase merges can add every PR commit after base.sha, so retain the
          # complete history needed to diff that exact pre-merge base.
          fetch-depth: 0
          ref: ${{ steps.merged-pr.outputs.merge-sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Prepare repository context
        env:
          MERGED_PR_NUMBER: ${{ steps.merged-pr.outputs.number }}
          MERGED_PR_TITLE: ${{ steps.merged-pr.outputs.title }}
          MERGE_BASE_SHA: ${{ steps.merged-pr.outputs.base-sha }}
          CLOSING_ISSUES_JSON: ${{ steps.merged-pr.outputs.closing-issues-json }}
        run: node scripts/self-improvement-review.js prepare

      - name: Review for a high-value candidate
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          prompt-file: self-improvement-prompt.md
          output-file: self-improvement-raw.md
          sandbox: read-only

      - name: Validate review result
        run: node scripts/self-improvement-review.js validate

      - name: Upload review result
        uses: actions/upload-artifact@v4
        with:
          name: self-improvement-review
          path: self-improvement-result.md
          if-no-files-found: error
          retention-days: 7
