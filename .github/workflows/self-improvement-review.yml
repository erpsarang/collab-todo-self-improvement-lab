name: Self-Improvement Review

on:
  workflow_run:
    workflows:
      - Merged PR Review Gate
    types:
      - completed

# This workflow observes repository state only. It cannot create issues, update
# pull requests, push branches, or change labels.
permissions:
  actions: read
  contents: read
  pull-requests: read

jobs:
  review:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      # workflow_run has repository secrets even when the original PR was from
      # a fork. Resolve the PR through GitHub's trusted API and never use the
      # workflow_run head SHA (which is the untrusted PR head).
      - name: Verify the human-merged pull request
        id: merged-pr
        uses: actions/github-script@v7
        with:
          script: |
            const run = context.payload.workflow_run;
            if (run.event !== 'pull_request') core.setFailed('Gate was not triggered by a pull request');
            const associated = await github.request(
              'GET /repos/{owner}/{repo}/actions/runs/{run_id}/pull_requests',
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: run.id,
              },
            );
            if (associated.data.length !== 1) core.setFailed('Expected exactly one associated pull request');
            const number = associated.data[0].number;
            const { data: pr } = await github.rest.pulls.get({ ...context.repo, pull_number: number });
            if (!pr.merged || !pr.merge_commit_sha) core.setFailed('Pull request is not merged');
            if (pr.merged_by?.type !== 'User') core.setFailed('Pull request was not merged by a human user');
            core.setOutput('number', pr.number);
            core.setOutput('title', pr.title);
            core.setOutput('base-sha', pr.base.sha);
            core.setOutput('merge-sha', pr.merge_commit_sha);

      - name: Check out the merged repository
        uses: actions/checkout@v4
        with:
          # Rebase merges can add every PR commit after base.sha, so retain the
          # complete history needed to diff that exact pre-merge base.
          fetch-depth: 0
          ref: ${{ steps.merged-pr.outputs.merge-sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Prepare repository context
        env:
          MERGED_PR_NUMBER: ${{ steps.merged-pr.outputs.number }}
          MERGED_PR_TITLE: ${{ steps.merged-pr.outputs.title }}
          MERGE_BASE_SHA: ${{ steps.merged-pr.outputs.base-sha }}
        run: node scripts/self-improvement-review.js prepare

      - name: Review for a high-value candidate
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          prompt-file: self-improvement-prompt.md
          output-file: self-improvement-raw.md
          sandbox: read-only

      - name: Validate review result
        run: node scripts/self-improvement-review.js validate

      - name: Upload review result
        uses: actions/upload-artifact@v4
        with:
          name: self-improvement-review
          path: self-improvement-result.md
          if-no-files-found: error
          retention-days: 7
