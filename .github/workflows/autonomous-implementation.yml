name: Autonomous Candidate Implementation

on:
  workflow_dispatch:
    inputs:
      publisher_run_id:
        description: Trusted Candidate Publisher run to revalidate
        required: true
        type: string

# Serialize dispatches so duplicate observations converge before any branch is published.
concurrency:
  group: autonomous-candidate-implementation
  cancel-in-progress: false

permissions: {}

jobs:
  implement:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      issues: read
      pull-requests: read
    outputs:
      eligible: ${{ steps.eligibility.outputs.eligible }}
    steps:
      - name: Verify trusted publisher run
        id: publisher
        uses: actions/github-script@v7
        with:
          script: |
            const runId = Number(context.payload.inputs?.publisher_run_id);
            if (!Number.isSafeInteger(runId) || runId <= 0) throw new Error('Invalid publisher run ID');
            const getRun = async () => (await github.rest.actions.getWorkflowRun({ ...context.repo, run_id: runId })).data;
            let run = await getRun();
            if (run.id !== runId || run.name !== 'Self-Improvement Candidate Publisher' ||
                run.path !== '.github/workflows/self-improvement-candidate-publisher.yml' || run.event !== 'workflow_run' ||
                run.head_branch !== 'main' || !/^[0-9a-f]{40}$/iu.test(run.head_sha)) {
              throw new Error('Untrusted Candidate Publisher provenance');
            }
            // The Publisher dispatches from its final step, before GitHub records
            // the run's conclusion. Wait for that exact already-authenticated run,
            // but never turn an incomplete or unsuccessful run into a trusted one.
            for (let attempt = 0; run.status !== 'completed' && attempt < 30; attempt += 1) {
              await new Promise((resolve) => setTimeout(resolve, 2000));
              run = await getRun();
              if (run.id !== runId || run.name !== 'Self-Improvement Candidate Publisher' ||
                  run.path !== '.github/workflows/self-improvement-candidate-publisher.yml' || run.event !== 'workflow_run' ||
                  run.head_branch !== 'main' || !/^[0-9a-f]{40}$/iu.test(run.head_sha)) {
                throw new Error('Candidate Publisher provenance changed while polling');
              }
            }
            if (run.status !== 'completed') throw new Error('Timed out waiting for Candidate Publisher completion');
            if (run.conclusion !== 'success') throw new Error(`Candidate Publisher did not succeed: ${run.conclusion}`);
            const { data: main } = await github.rest.git.getRef({ ...context.repo, ref: 'heads/main' });
            if (main.object.sha !== run.head_sha) throw new Error('Publisher is not based on current trusted main');
            const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts,
              { ...context.repo, run_id: run.id, per_page: 100 });
            const exact = artifacts.filter(({ name, expired }) => name === 'candidate-dispatch' && !expired);
            if (exact.length !== 1) throw new Error(`Expected exactly one Candidate dispatch, found ${exact.length}`);
            core.setOutput('has-dispatch', 'true');
            core.setOutput('run-id', String(run.id));
      # Checkout must precede artifact download: checkout cleans an unversioned
      # workspace and would otherwise remove the trusted dispatch.
      - name: Check out trusted implementation base
        if: steps.publisher.outputs.has-dispatch == 'true'
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Download exact Candidate dispatch
        if: steps.publisher.outputs.has-dispatch == 'true'
        uses: actions/download-artifact@v4
        with:
          name: candidate-dispatch
          path: candidate-dispatch
          run-id: ${{ steps.publisher.outputs.run-id }}
          github-token: ${{ github.token }}
      - name: Evaluate eligibility from trusted metadata
        if: steps.publisher.outputs.has-dispatch == 'true'
        id: eligibility
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const { eligibility, isOwnedImplementationPull, validateDispatch } = require('./scripts/autonomous-implementation');
            const dispatch = validateDispatch(JSON.parse(fs.readFileSync('candidate-dispatch/candidate-dispatch.json', 'utf8')));
            const { data: issue } = await github.rest.issues.get({ ...context.repo, issue_number: dispatch.candidateIssueNumber });
            const { data: main } = await github.rest.git.getRef({ ...context.repo, ref: 'heads/main' });
            const decision = eligibility(dispatch, issue, main.object.sha);
            if (!decision.eligible) { core.notice(`Safe stop: ${decision.reason}`); core.setOutput('eligible', 'false'); return; }
            const pulls = await github.paginate(github.rest.pulls.list, { ...context.repo, state: 'open', per_page: 100 });
            if (pulls.some((pull) => isOwnedImplementationPull(pull, dispatch.candidateKey, `${context.repo.owner}/${context.repo.repo}`))) {
              core.notice('Safe stop: an active implementation PR already exists'); core.setOutput('eligible', 'false'); return;
            }
            core.setOutput('eligible', 'true');
      - name: Set up Node.js
        if: steps.eligibility.outputs.eligible == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Capture trusted base test entry point
        if: steps.eligibility.outputs.eligible == 'true'
        run: |
          node - <<'NODE'
          const { readFileSync, writeFileSync } = require('node:fs');
          const { join } = require('node:path');
          const command = JSON.parse(readFileSync('package.json', 'utf8')).scripts?.test;
          if (typeof command !== 'string' || !command.trim()) throw new Error('Trusted base has no test entry point');
          writeFileSync(join(process.env.RUNNER_TEMP, 'trusted-test-command'), command, { mode: 0o500 });
          const { execFileSync } = require('node:child_process');
          const { createHash } = require('node:crypto');
          const isTrustedTestPath = (path) => /(^|\/)(?:test|tests|__tests__)(?:\/|$)/u.test(path) ||
            /(?:^|\/)[^/]+\.(?:test|spec)\.[^/]+$/u.test(path);
          const paths = execFileSync('git', ['ls-tree', '-r', '--name-only', '-z', 'HEAD']).toString().split('\0').filter(isTrustedTestPath);
          if (!paths.length) throw new Error('Trusted base has no test files');
          const snapshot = paths.map((path) => ({ path, sha256: createHash('sha256').update(readFileSync(path)).digest('hex') }));
          writeFileSync(join(process.env.RUNNER_TEMP, 'trusted-tests.json'), JSON.stringify(snapshot));
          NODE
          # This verifier is copied before Codex runs and lives outside its
          # workspace-write sandbox. Never load verification code from the
          # Candidate-controlled checkout after implementation.
          cp scripts/verify-trusted-tests.js "$RUNNER_TEMP/verify-trusted-tests.js"
          chmod 500 "$RUNNER_TEMP/verify-trusted-tests.js"
      - name: Prepare trusted implementation prompt
        if: steps.eligibility.outputs.eligible == 'true'
        run: node scripts/autonomous-implementation.js prepare
      - name: Implement Candidate without repository credentials
        if: steps.eligibility.outputs.eligible == 'true'
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          prompt-file: autonomous-implementation-prompt.md
          sandbox: workspace-write
      - name: Run full test suite
        if: steps.eligibility.outputs.eligible == 'true'
        # Never invoke the Candidate-controlled package.json test script. Execute
        # the entry point captured from the trusted base with npm's local tools.
        run: |
          npm install
          node "$RUNNER_TEMP/verify-trusted-tests.js" "$RUNNER_TEMP/trusted-tests.json"
          PATH="$PWD/node_modules/.bin:$PATH" bash -eo pipefail "$RUNNER_TEMP/trusted-test-command"
      - name: Build verifiable implementation artifact
        if: steps.eligibility.outputs.eligible == 'true'
        run: |
          cp candidate-dispatch/candidate-dispatch.json /tmp/candidate-dispatch.json
          rm -rf autonomous-implementation-prompt.md candidate-dispatch
          # Keep install output out of the artifact while retaining source,
          # package manifest, and lock-file changes (including deletions).
          git add --intent-to-add --all -- . ':(exclude)node_modules' ':(exclude)**/node_modules/**'
          # Diff against HEAD so the artifact contains staged deletions as well as
          # unstaged modifications and intent-to-add files from the tested tree.
          git diff HEAD --binary --full-index --no-ext-diff -- . \
            ':(exclude)node_modules' ':(exclude)**/node_modules/**' > implementation.patch
          test -s implementation.patch
          mkdir candidate-dispatch
          cp /tmp/candidate-dispatch.json candidate-dispatch/candidate-dispatch.json
          node scripts/autonomous-implementation.js manifest
      - name: Upload implementation artifact
        if: steps.eligibility.outputs.eligible == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: candidate-implementation
          path: |
            implementation.patch
            implementation-manifest.json
            candidate-dispatch/candidate-dispatch.json
          if-no-files-found: error

  publish:
    needs: implement
    if: needs.implement.outputs.eligible == 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
      issues: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          # Only this write-scoped job receives checkout's push credential.
          persist-credentials: true
      - uses: actions/download-artifact@v4
        with:
          name: candidate-implementation
          path: candidate-implementation
      - name: Validate base, patch, and duplicate state
        id: validate
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const { execFileSync } = require('node:child_process');
            const { eligibility, isOwnedImplementationPull, validateDispatch, validateManifest } = require('./scripts/autonomous-implementation');
            const root = 'candidate-implementation/';
            const dispatch = validateDispatch(JSON.parse(fs.readFileSync(`${root}candidate-dispatch.json`, 'utf8')));
            const manifest = JSON.parse(fs.readFileSync(`${root}implementation-manifest.json`, 'utf8'));
            const patch = fs.readFileSync(`${root}implementation.patch`, 'utf8');
            const { data: main } = await github.rest.git.getRef({ ...context.repo, ref: 'heads/main' });
            validateManifest(manifest, dispatch, patch, main.object.sha);
            execFileSync('git', ['apply', '--check', `${root}implementation.patch`]);
            const index = `${process.env.RUNNER_TEMP}/candidate-${context.runId}-${context.runAttempt}.index`;
            const gitEnv = { ...process.env, GIT_INDEX_FILE: index };
            execFileSync('git', ['read-tree', 'HEAD'], { env: gitEnv });
            execFileSync('git', ['apply', '--cached', `${root}implementation.patch`], { env: gitEnv });
            const changed = execFileSync('git', ['diff', '--cached', '--name-status', '-z', '--find-renames', '--find-copies', 'HEAD'],
              { encoding: 'utf8', env: gitEnv }).split('\0').filter(Boolean);
            for (let i = 0; i < changed.length;) {
              const status = changed[i++];
              const paths = /^[RC]/u.test(status) ? [changed[i++], changed[i++]] : [changed[i++]];
              if (paths.some((path) => path === '.github' || path.startsWith('.github/'))) {
                throw new Error('Changes involving .github are not publishable');
              }
            }
            const { data: issue } = await github.rest.issues.get({ ...context.repo, issue_number: dispatch.candidateIssueNumber });
            const decision = eligibility(dispatch, issue, main.object.sha);
            if (!decision.eligible) {
              core.notice(`Safe stop: Candidate is no longer eligible: ${decision.reason}`);
              core.setOutput('publish', 'false');
              return;
            }
            const pulls = await github.paginate(github.rest.pulls.list, { ...context.repo, state: 'open', per_page: 100 });
            if (pulls.some((pull) => isOwnedImplementationPull(pull, dispatch.candidateKey, `${context.repo.owner}/${context.repo.repo}`))) {
              core.notice('An implementation PR already exists; publishing is unnecessary'); core.setOutput('publish', 'false'); return;
            }
            core.setOutput('publish', 'true');
            core.setOutput('branch', `codex/autonomous-${dispatch.candidateKey.slice(7, 23)}-${context.runId}-${context.runAttempt}`);
            core.setOutput('issue', String(dispatch.candidateIssueNumber));
            core.setOutput('key', dispatch.candidateKey);
            core.setOutput('review-run', String(dispatch.sourceReviewRunId));
            core.setOutput('base-sha', dispatch.sourceMergeSha);
            core.setOutput('title', dispatch.title);
      - name: Apply validated patch and publish branch
        if: steps.validate.outputs.publish == 'true'
        env:
          BRANCH: ${{ steps.validate.outputs.branch }}
        run: |
          git apply --index candidate-implementation/implementation.patch
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "Implement validated self-improvement Candidate"
          git push origin "HEAD:refs/heads/$BRANCH"
      - name: Create implementation pull request
        if: steps.validate.outputs.publish == 'true'
        uses: actions/github-script@v7
        env:
          BRANCH: ${{ steps.validate.outputs.branch }}
          ISSUE: ${{ steps.validate.outputs.issue }}
          KEY: ${{ steps.validate.outputs.key }}
          REVIEW_RUN: ${{ steps.validate.outputs.review-run }}
          BASE_SHA: ${{ steps.validate.outputs.base-sha }}
          TITLE: ${{ steps.validate.outputs.title }}
        with:
          script: |
            const { implementationMarker } = require('./scripts/autonomous-implementation');
            const body = `${implementationMarker(process.env.KEY)}\n\nCandidate Issue: #${process.env.ISSUE}\nCandidate Key: ${process.env.KEY}\nSource Review run: ${process.env.REVIEW_RUN}\nSource merge SHA: ${process.env.BASE_SHA}\nTests: trusted base test entry point (PASS)\n\nCloses #${process.env.ISSUE}`;
            await github.rest.pulls.create({ ...context.repo, head: process.env.BRANCH, base: 'main',
              title: `Implement Candidate #${process.env.ISSUE}: ${process.env.TITLE}`, body });
